<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شحن الألعاب والعملات</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      background: #0b1020;
      color: #fff;
      min-height: 100vh;
    }

    .container {
      width: 92%;
      max-width: 1100px;
      margin: auto;
    }

    header {
      padding: 25px 0;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 10px;
      color: #6c63ff;
    }

    header p {
      color: #aaa;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin: 25px 0;
    }

    .game {
      background: #151b31;
      border: 1px solid #272e4a;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
    }

    .game:hover,
    .game.active {
      border-color: #6c63ff;
      transform: translateY(-3px);
      background: #1b2140;
    }

    .game-icon {
      width: 65px;
      height: 65px;
      border-radius: 15px;
      background: #252c49;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }

    .game h3 {
      font-size: 16px;
    }

    .order-box {
      background: #151b31;
      border: 1px solid #272e4a;
      border-radius: 20px;
      padding: 25px;
      margin: 30px 0;
    }

    .order-box h2 {
      margin-bottom: 20px;
      color: #6c63ff;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #ddd;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #343b59;
      background: #0d1325;
      color: #fff;
      outline: none;
      font-size: 15px;
    }

    input:focus,
    select:focus {
      border-color: #6c63ff;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #6c63ff;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #574ee8;
    }

    .message {
      display: none;
      padding: 15px;
      margin-top: 15px;
      border-radius: 10px;
      text-align: center;
      background: #123b2b;
      color: #6ff0ad;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 25px;
    }
  </style>
</head>

<body>

  <header>
    <div class="container">
      <h1>🎮 متجر شحن الألعاب</h1>
      <p>اشحن ألعابك وتطبيقاتك بسهولة وسرعة</p>
    </div>
  </header>

  <main class="container">

    <h2>اختر اللعبة</h2>

    <div class="games">

      <div class="game active" onclick="selectGame('Free Fire', this)">
        <div class="game-icon">🔥</div>
        <h3>Free Fire</h3>
      </div>

      <div class="game" onclick="selectGame('PUBG Mobile', this)">
        <div class="game-icon">🎯</div>
        <h3>PUBG Mobile</h3>
      </div>

      <div class="game" onclick="selectGame('Mobile Legends', this)">
        <div class="game-icon">⚔️</div>
        <h3>Mobile Legends</h3>
      </div>

      <div class="game" onclick="selectGame('Roblox', this)">
        <div class="game-icon">🧱</div>
        <h3>Roblox</h3>
      </div>

      <div class="game" onclick="selectGame('Call of Duty', this)">
        <div class="game-icon">🔫</div>
        <h3>Call of Duty</h3>
      </div>

    </div>

    <div class="order-box">

      <h2>🛒 بيانات طلب الشحن</h2>

      <form id="orderForm">

        <div class="form-group">
          <label>اسم اللعبة / التطبيق</label>

          <input
            type="text"
            id="gameName"
            value="Free Fire"
            readonly
          >
        </div>

        <div class="form-group">
          <label>الـ ID الخاص بالمستخدم</label>

          <input
            type="text"
            id="userId"
            placeholder="أدخل User ID"
            required
          >
        </div>

        <div class="form-group">
          <label>المبلغ / الكمية</label>

          <input
            type="text"
            id="amount"
            placeholder="مثال: 100 جوهرة"
            required
          >
        </div>

        <div class="form-group">
          <label>رقم الهاتف / واتساب</label>

          <input
            type="tel"
            id="phone"
            placeholder="01xxxxxxxxx"
            required
          >
        </div>

        <button type="submit">
          إرسال الطلب
        </button>

        <div class="message" id="message">
          تم إرسال طلبك بنجاح ✅
        </div>

      </form>

    </div>

  </main>

  <footer>
    جميع الحقوق محفوظة © 2026
  </footer>

  <script>

    let selectedGame = "Free Fire";

    function selectGame(gameName, element) {

      selectedGame = gameName;

      document.getElementById("gameName").value = gameName;

      document.querySelectorAll(".game").forEach(game => {
        game.classList.remove("active");
      });

      element.classList.add("active");
    }

    document
      .getElementById("orderForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const order = {
          id: Date.now(),

          game: document.getElementById("gameName").value,

          userId: document.getElementById("userId").value,

          amount: document.getElementById("amount").value,

          phone: document.getElementById("phone").value,

          date: new Date().toLocaleString("ar-EG")
        };

        let orders =
          JSON.parse(localStorage.getItem("orders")) || [];

        orders.push(order);

        localStorage.setItem(
          "orders",
          JSON.stringify(orders)
        );

        document.getElementById("message").style.display = "block";

        document.getElementById("orderForm").reset();

        document.getElementById("gameName").value = selectedGame;

        setTimeout(() => {
          document.getElementById("message").style.display = "none";
        }, 4000);

      });

  </script>

</body>
</html>
