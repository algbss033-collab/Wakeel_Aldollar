Enter<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>لوحة تحكم الإدارة</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      background: #0b1020;
      color: white;
      min-height: 100vh;
    }

    .container {
      width: 94%;
      max-width: 1200px;
      margin: auto;
    }

    header {
      padding: 30px 0;
    }

    header h1 {
      color: #6c63ff;
      margin-bottom: 8px;
    }

    header p {
      color: #999;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .count {
      background: #151b31;
      border: 1px solid #272e4a;
      padding: 12px 18px;
      border-radius: 10px;
    }

    .count span {
      color: #6c63ff;
      font-weight: bold;
    }

    .delete-all {
      width: auto;
      background: #e74c3c;
      padding: 12px 20px;
    }

    .delete-all:hover {
      background: #c0392b;
    }

    .table-box {
      background: #151b31;
      border: 1px solid #272e4a;
      border-radius: 15px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th {
      background: #1d2440;
      color: #aaa;
      padding: 15px;
      text-align: center;
    }

    td {
      padding: 15px;
      text-align: center;
      border-top: 1px solid #272e4a;
    }

    tr:hover {
      background: #1a2038;
    }

    .delete-btn {
      width: auto;
      padding: 8px 12px;
      background: #e74c3c;
      font-size: 13px;
    }

    .empty {
      text-align: center;
      padding: 50px;
      color: #888;
    }

    .phone {
      direction: ltr;
    }

    footer {
      text-align: center;
      color: #666;
      padding: 30px;
    }

  </style>

</head>

<body>

  <header>

    <div class="container">

      <h1>⚙️ لوحة تحكم الإدارة</h1>

      <p>
        إدارة ومتابعة طلبات شحن الألعاب
      </p>

    </div>

  </header>


  <main class="container">

    <div class="top-bar">

      <div class="count">
        عدد الطلبات:
        <span id="orderCount">0</span>
      </div>

      <button
        class="delete-all"
        onclick="deleteAllOrders()"
      >
        حذف جميع الطلبات
      </button>

    </div>


    <div class="table-box">

      <table>

        <thead>

          <tr>
            <th>#</th>
            <th>اللعبة</th>
            <th>User ID</th>
            <th>المبلغ / الكمية</th>
            <th>رقم الهاتف</th>
            <th>التاريخ</th>
            <th>إجراء</th>
          </tr>

        </thead>

        <tbody id="ordersTable">

        </tbody>

      </table>

      <div
        class="empty"
        id="emptyMessage"
      >
        لا توجد طلبات حتى الآن.
      </div>

    </div>

  </main>


  <footer>
    لوحة تحكم المتجر © 2026
  </footer>


  <script>

    function loadOrders() {

      const orders =
        JSON.parse(localStorage.getItem("orders")) || [];

      const table =
        document.getElementById("ordersTable");

      const empty =
        document.getElementById("emptyMessage");

      const count =
        document.getElementById("orderCount");

      table.innerHTML = "";

      count.textContent = orders.length;

      if (orders.length === 0) {

        empty.style.display = "block";

        return;

      }

      empty.style.display = "none";


      orders.forEach((order, index) => {

        const row =
          document.createElement("tr");

        row.innerHTML = `

          <td>${index + 1}</td>

          <td>${escapeHTML(order.game)}</td>

          <td>${escapeHTML(order.userId)}</td>

          <td>${escapeHTML(order.amount)}</td>

          <td class="phone">
            ${escapeHTML(order.phone)}
          </td>

          <td>${escapeHTML(order.date)}</td>

          <td>
            <button
              class="delete-btn"
              onclick="deleteOrder(${order.id})"
            >
              حذف
            </button>
          </td>

        `;

        table.appendChild(row);

      });

    }


    function deleteOrder(id) {

      if (!confirm("هل تريد حذف هذا الطلب؟")) {
        return;
      }

      let orders =
        JSON.parse(localStorage.getItem("orders")) || [];

      orders =
        orders.filter(order => order.id !== id);

      localStorage.setItem(
        "orders",
        JSON.stringify(orders)
      );

      loadOrders();

    }


    function deleteAllOrders() {

      const orders =
        JSON.parse(localStorage.getItem("orders")) || [];

      if (orders.length === 0) {
        return;
      }

      if (
        !confirm(
          "هل أنت متأكد من حذف جميع الطلبات؟"
        )
      ) {
        return;
      }

      localStorage.removeItem("orders");

      loadOrders();

    }


    function escapeHTML(value) {

      const div =
        document.createElement("div");

      div.textContent = value ?? "";

      return div.innerHTML;

    }


    loadOrders();

    // تحديث القائمة تلقائياً
    setInterval(loadOrders, 3000);

  </script>

</body>

    </html>
